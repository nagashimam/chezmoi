format = '$directory$git_branch$git_status$nodejs$cmd_duration$status$line_break$character'
add_newline = false

[directory]
format = '[$path]($style) '
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = '[git:$branch]($style) '

[git_status]
format = '[$all_status$ahead_behind]($style) '
conflicted = 'conflict '
ahead = 'ahead '
behind = 'behind '
diverged = 'diverged '
up_to_date = ''
untracked = 'untracked '
stashed = 'stashed '
modified = 'modified '
staged = 'staged '
renamed = 'renamed '
deleted = 'deleted '

[nodejs]
format = '[node:$version]($style) '

[cmd_duration]
min_time = 2_000
format = '[took $duration]($style) '

[status]
disabled = false
format = '[status:$status]($style) '

[character]
success_symbol = '>'
error_symbol = '!>'
vimcmd_symbol = '<'
